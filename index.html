const names=['Krümel','Horst','Pünktchen','Koko','Fussel','Flocke','Tapsi','Krahla','Wölkchen'];
let blooms=[],bloomCount=0,bloomRadius=52,bloomClock=0,experimentalFinished=false,obachtBest=0,blossomStreak=0,bloomSpawnIndex=0;
let mode=null,shuffledNames=[],soulUnlocked=false,soulChoice=false,soul=null,soulContact=0,soulFleeElapsed=0,highTotal=0,highBest=0,storyMilestone=0;
try{soulUnlocked=localStorage.getItem('murmur_soul_unlocked')==='yes';highBest=+(localStorage.getItem('murmur_high_best')||0)||0;obachtBest=+(localStorage.getItem('murmur_obacht_best')||0)||0;}catch(_){}

const playingVoices=new Set();

 stopPendingSounds();rings=[];blooms=[];sparks=[];starTrails=[];bonuses=[];effects=[];echoes=[];clouds=[];

}

function resize(){const r=root.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(350,r.height);dpr=Math.min(devicePixelRatio||1,(matchMedia("(pointer:coarse)").matches?1.5:2));canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);target.x=clamp(target.x,30,W-30);target.y=clamp(target.y,50,H-35);if(!birds.length)seedBirds();setupBackground();setupSprites();}
function seedBirds(){birds=[];leader.x=target.x=W*.5;leader.y=target.y=H*.53;target.px=target.x;target.py=target.y;leader.vx=leader.vy=0;target.vx=target.vy=0;for(let i=0;i<1;i++){let a=i*2.39996,r=22+Math.sqrt(i)*11;birds.push({x:leader.x+Math.cos(a)*r,y:leader.y+Math.sin(a)*r,vx:rnd(-12,12),vy:rnd(-12,12),phase:rnd(0,7),size:rnd(9.5,12),character:rnd(.85,1.15),history:[],color:i%4,name:'Muru',soulmate:false});}center.x=leader.x;center.y=leader.y;prevCenter.x=center.x;prevCenter.y=center.y;}
function resetJourney(){clearRun();level=1;score=0;wallet=0;shopPurchased={};hatId=0;styleId=0;flow=1;bestFlow=1;shuffledNames=[...names].sort(()=>Math.random()-.5); // shuffled below again with unbiased Fisher–Yates
for(let i=shuffledNames.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[shuffledNames[i],shuffledNames[j]]=[shuffledNames[j],shuffledNames[i]];}

 ringCount=0;goal=0;levelScore=score;flow=1;bestFlow=1;runTime=0;timeLeft=mode==='story'?60:120;
 blooms=[];bloomCount=0;bloomRadius=54;bloomClock=0;blossomStreak=0;bloomSpawnIndex=0;experimentalFinished=false;

 bonusTimeTaken=0;bonusSpawn=8;levelExtras=0;musicClock=0;musicStep=0;lastAward={};
 moveDuration=0;straightDuration=0;arcDuration=0;fastDuration=0;braidDuration=0;
 formationWasLoose=false;formationCooldown=0;rings=[];sparks=[];clouds=[];echoes=[];effects=[];

 if(mode==='obacht')spawnObachtPortals();
 else if(mode==='experimental')addBloom(true);
 else{for(let i=0;i<3;i++)addRing(true);for(let i=0;i<12;i++)addSpark(true);}
 for(let i=0;i<5;i++)addCloud();
 ui.hint.style.opacity='1';ui.toast.classList.remove('show');toastTimer=0;lastCursor=clock;ui.shop.hidden=true;

 }else{
   ui.hint.textContent=mode==='obacht'?'2 × Türkis sammeln · 2 × Rot meiden':mode==='experimental'?'Folge den Lichtblüten · ganz ohne Eile':'Sanfte Kurven · Lichtsterne · leise Echos';

}
// Four simultaneous portals, shuffled each time. Generation is checked against the
// FULL glowing stroke, and includes a deterministic 2×2 fallback for tiny screens.
function spawnObachtPortals(){
 rings=[];
 const radius=clamp(Math.min(33,(H-130)/5.3,(W-30)/8),25,33);
 const gap=18;
 const minX=radius+12,maxX=W-radius-12;
 const minY=85+radius+12,maxY=H-35-radius-12;
 const kinds=['teal','teal','red','red'];
 // Fisher-Yates: avoid assigning the same colors to the same locations.
 for(let i=kinds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[kinds[i],kinds[j]]=[kinds[j],kinds[i]];}
 const positions=[];
 for(let i=0;i<4;i++){
   let found=null;
   for(let attempt=0;attempt<240;attempt++){
     const x=rnd(minX,maxX),y=rnd(minY,maxY);
     const clearance=positions.every(p=>hypot(x-p.x,y-p.y)>2*radius*1.055+gap);
     const fromBirds=birds.every(b=>hypot(x-b.x,y-b.y)>radius+b.size+17);
     if(clearance&&(fromBirds||attempt>100)){found={x,y};break;}
   }
   if(!found){
     // Fair, non-overlapping base layout, with a random mirror/rotation.
     positions.length=0;
     const cells=[[.22,.18],[.78,.18],[.22,.82],[.78,.82]];
     const flip=Math.random()<.5,rev=Math.random()<.5;
     for(const [u,v] of cells){positions.push({x:lerp(minX,maxX,flip?1-u:u),y:lerp(minY,maxY,rev?1-v:v)});}
     break;
   }
   positions.push(found);
 }
 // Layout itself still uses collision enforcement for extremely short viewports.
 for(let i=0;i<4;i++){
   const angle=rnd(0,Math.PI*2),speed=rnd(7,11);
   rings.push({x:positions[i].x,y:positions[i].y,r:radius,baseR:radius,
     age:0,phase:rnd(0,6.28),claimed:false,kind:kinds[i],
     vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed});
 }

}
function keepPortalInside(p){
 const margin=p.r*1.055+9;
 const loX=margin,hiX=Math.max(loX,W-margin);
 const loY=85+margin,hiY=Math.max(loY,H-35-margin);
 if(p.x<loX||p.x>hiX){p.x=clamp(p.x,loX,hiX);p.vx*=-1;}
 if(p.y<loY||p.y>hiY){p.y=clamp(p.y,loY,hiY);p.vy*=-1;}
}
function separateObachtPortals(){
 // Four circles only: fixed, cheap iteration handles both initial overlap and
 // drift collisions. Padding covers pulsation and 9 px outlines.
 for(let pass=0;pass<10;pass++){
   let moved=false;
   for(let i=0;i<rings.length;i++)for(let j=i+1;j<rings.length;j++){
     const a=rings[i],b=rings[j];let dx=b.x-a.x,dy=b.y-a.y;
     let d=hypot(dx,dy);
     const safe=(a.r+b.r)*1.055+15;
     if(d>=safe)continue;
     moved=true;
     if(d<.0001){const theta=(i*2.4+j*1.3);dx=Math.cos(theta);dy=Math.sin(theta);d=1;}
     const nx=dx/d,ny=dy/d,offset=(safe-d)*.5+.02;
     a.x-=nx*offset;a.y-=ny*offset;
     b.x+=nx*offset;b.y+=ny*offset;
     const closing=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
     if(closing<0){const impulse=-(1.12)*closing*.5;a.vx-=nx*impulse;a.vy-=ny*impulse;b.vx+=nx*impulse;b.vy+=ny*impulse;}
   }
   for(const ring of rings)keepPortalInside(ring);
   if(!moved)break;

function showModeChoice(){state='intro';clearRun();mode=null;root.classList.add('menu');seedBirds();ui.level.textContent='MURMUR';ui.progressLabel.textContent='';ui.progress.style.width='0%';ui.score.textContent='0';ui.combo.textContent='Flow ×1';ui.overlay.hidden=false;ui.modes.hidden=false;ui.eyebrow.textContent='Ein Spiel über sanfte Bewegung';ui.heading.textContent='MURMUR';ui.description.textContent='Vier kleine Flugwelten im Regenbogenhimmel. Wähle deine Reise.';ui.results.hidden=true;ui.shop.hidden=true;ui.begin.disabled=true;ui.begin.textContent='Wähle deinen Modus';ui.restart.hidden=true;ui.storyMode.classList.remove('selected');ui.highMode.classList.remove('selected');ui.obachtMode.classList.remove('selected');ui.experimentalMode.classList.remove('selected');ui.score.parentElement.hidden=false;ui.pause.textContent='Ⅱ';const old=$('soulChoice');if(old)old.remove();forceSceneUpdate();}
function chooseMode(m){
 mode=m;
 for(const [id,value] of [['storyMode','story'],['highMode','highscore'],['obachtMode','obacht'],['experimentalMode','experimental']])ui[id].classList.toggle('selected',m===value);
 ui.begin.disabled=false;
 const desc={story:'Neun Freunde finden dich, jeder nach einem einminütigen Flug. Die letzte Suche hat kein Zeitlimit: Erst nach ein paar Punkten erscheint Herzchen.',highscore:'Fünf ruhige Flüge à zwei Minuten. Sammle Punkte und kaufe zwischen den Runden Raben und kleine Accessoires.',obacht:'Ein Flug, zwei Minuten: Zwei türkise und zwei rote Ringe. Nach jedem Treffer wechseln alle vier.',experimental:'Lichtgarten ∞: Fliege durch einen endlosen Garten aus ruhenden, wandernden und sanft verblassenden Lichtblüten. Keine Uhr, keine Minuspunkte – höre auf, wann du möchtest.'};
 ui.begin.textContent={story:'Geschichte beginnen',highscore:'Highscore beginnen',obacht:'Obacht! starten',experimental:'Lichtgarten betreten'}[m];ui.description.textContent=desc[m];
 const old=$('soulChoice');if(old)old.remove();
 if(m!=='story'&&soulUnlocked){const line=document.createElement('label');line.className='soulToggle';line.innerHTML='<input type="checkbox" id="useSoul"> Mit Herzchen ♡ starten';line.id='soulChoice';ui.modes.appendChild(line);line.querySelector('input').checked=soulChoice;line.querySelector('input').addEventListener('change',e=>{soulChoice=e.target.checked;});} forceSceneUpdate();
}
ui.storyMode.addEventListener('click',()=>chooseMode('story'));
ui.highMode.addEventListener('click',()=>chooseMode('highscore'));
ui.obachtMode.addEventListener('click',()=>chooseMode('obacht'));
ui.experimentalMode.addEventListener('click',()=>chooseMode('experimental'));
ui.begin.addEventListener('click',()=>{if(state==='intro'){soundOn=true;ui.sound.textContent='♪';initAudio();resetJourney();}else if(state==='complete'){if((mode==='highscore'&&level===5)||mode==='obacht'){resetJourney();}else{level++;startLevel();}}else if(state==='experimentalWon'){resetJourney();}else if(state==='storyWon'){showModeChoice();return;}play();});
ui.restart.addEventListener('click',()=>{showModeChoice();});
ui.pause.addEventListener('click',()=>{if(state==='playing')overlayPause();else if(state==='paused')play();});
ui.sound.addEventListener('click',()=>{soundOn=!soundOn;ui.sound.textContent=soundOn?'♪':'♪̸';ui.sound.setAttribute('aria-label',soundOn?'Ton ausschalten':'Ton einschalten');if(soundOn){initAudio();tone(460,.17);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')overlayPause();});window.addEventListener('resize',resize);resize();for(let i=0;i<4;i++)addCloud();showModeChoice();raf=requestAnimationFrame(frame);
})();
</script>
<script>
// Register once. The game also works normally in a browser before installation.
// Service workers require HTTPS or localhost; direct file:// launch is intentionally skipped.
if ('serviceWorker' in navigator && (location.protocol === 'https:' ||
    ['localhost', '127.0.0.1'].includes(location.hostname))) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .catch(err => console.info('MURMUR Offline-Modus nicht verfügbar:', err));
  });
}
</script>
