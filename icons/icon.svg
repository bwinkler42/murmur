<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
<defs>
 <linearGradient id="sky" x1="0" x2="1" y1="0.1" y2="1">
  <stop offset="0" stop-color="#a0dacc"/><stop offset=".33" stop-color="#a5c4e2"/>
  <stop offset=".66" stop-color="#e8bce0"/><stop offset="1" stop-color="#ffdab7"/>
 </linearGradient>
 <radialGradient id="halo"><stop stop-color="#fff9dd" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="body" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#4d5266"/><stop offset="1" stop-color="#252d40"/></linearGradient>
 <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#646d82"/><stop offset="1" stop-color="#303a50"/></linearGradient>
</defs>
<rect width="512" height="512" rx="103" fill="url(#sky)"/>
<circle cx="280" cy="214" r="218" fill="url(#halo)"/>
<g fill="#fff8e9" opacity=".75">
 <path d="M80 123 L84 138 L99 142 L84 146 L80 161 L76 146 L61 142 L76 138Z"/>
 <path d="M402 87 L406 99 L418 103 L406 107 L402 119 L398 107 L386 103 L398 99Z"/>
 <circle cx="422" cy="325" r="5"/><circle cx="90" cy="350" r="7"/>
</g>
