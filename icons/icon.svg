<ellipse cx="302" cy="232" rx="24" ry="29" fill="#fff8f0"/>
<circle cx="241" cy="229" r="14" fill="#283349"/>
<circle cx="310" cy="235" r="12" fill="#283349"/>
<circle cx="235" cy="221" r="6" fill="#ffffff"/>
<circle cx="305" cy="228" r="5" fill="#ffffff"/>
